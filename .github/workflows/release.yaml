# Build the image and the chart on every push and pull request. Publish both to GHCR from main only.
# The chart version is <major>.<minor> from Chart.yaml plus the run number.
name: release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/selfoss
  CHARTS: oci://ghcr.io/${{ github.repository_owner }}/charts

jobs:
  image:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.upstream.outputs.version }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      # Image version: selfoss commit plus run number, so packaging changes get a new tag.
      - name: Read the selfoss commit
        id: upstream
        run: |
          sha=$(git -C selfoss rev-parse --short=8 HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "version=$sha-$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.upstream.outputs.sha }},enable={{is_default_branch}}
            type=raw,value=${{ steps.upstream.outputs.version }},enable={{is_default_branch}}
            type=sha,prefix=build-
          labels: |
            org.opencontainers.image.title=selfoss
            org.opencontainers.image.description=selfoss RSS reader, built from fossar/selfoss@${{ steps.upstream.outputs.sha }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  chart:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: azure/setup-helm@v4

      - name: Lint
        run: helm lint charts/selfoss

      - name: Package
        run: |
          base=$(yq '.version' charts/selfoss/Chart.yaml)
          version="${base%.*}.${GITHUB_RUN_NUMBER}"
          helm package charts/selfoss --version "$version" --app-version "${{ needs.image.outputs.version }}"

      - name: Push
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push selfoss-*.tgz "$CHARTS"
